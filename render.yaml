services:
  - type: web
    name: vitawatch-spectra-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 2 --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.9
      - key: CORS_ORIGINS
        value: "*"
      - key: APP_MODE
        value: live
